[project]
name = "CalibDBReader"
version = "0.9.0"
description = "Reader for SIMBIO-SYS and JANUS calibration databases"
authors = [
    { name = "Romolo Politi", email = "Romolo.Politi@inaf.it" },
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "gitpython>=3.1.45,<4",
    "numpy>=2.3.4,<3",
    "pandas>=2.3.3,<4",
    "polars>=1.42.1",
    "rich>=15.0.0,<16",
    "rich-click>=1.9.7,<2",
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
    "Space Mission",
    "BepiColombo",
    "SIMBIO_SYS",
    "Calibration Database",
    "JUICE",
    "JANUS",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"
]

[project.urls]
Repository = "https://github.com/RomoloPoliti-INAF/Calib_DB_Reader"
Issues = "https://github.com/RomoloPoliti-INAF/Calib_DB_Reader/issues"
Changelog = "https://github.com/RomoloPoliti-INAF/Calib_DB_Reader/CHANGELOG.md"

[project.optional-dependencies]
docs = ["sphinx"]

[project.scripts]
calibDB = "CalibDBReader.cli:cli"

[dependency-groups]
test = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
]
devel = [
    "ruff>=0.15.7,<0.16",
]

[tool.uv]
default-groups = ["test", "devel"]

[tool.uv.build-backend]
module-name = "CalibDBReader"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--basetemp=/tmp/calibdbreader/pytest",
    "--cov=CalibDBReader",
    "--cov-report=term-missing",
]
cache_dir = "/tmp/calibdbreader/pytest-cache"

[tool.coverage.run]
data_file = "/tmp/calibdbreader/coverage/.coverage"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"
